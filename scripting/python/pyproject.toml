[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tunelab"
version = "0.1.0"
description = "TuneLab scripted-plugin facade (Python sidecar protocol, wire v1)"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TuneLab" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]

[project.urls]
Homepage = "https://github.com/mhbalthasar/TuneLab"

[tool.setuptools]
packages = ["tunelab"]
